<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="/image.webp" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Preload Google Fonts with swap for better performance -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"></noscript>
    <meta
      name="description"
      content="Build optimal Honkai Star Rail teams with our comprehensive team builder. Discover character synergies, get BiS and F2P team recommendations, and find the perfect teammates for your favorite characters."
    />

    <!-- Cache Control Meta Tags -->
    <meta http-equiv="Cache-Control" content="public, max-age=31536000" />
    <meta http-equiv="Expires" content="31536000" />

    <!-- Remove invalid preload directives - directories can't be preloaded -->
    <!-- Images will be lazy loaded and cached by service worker -->

    <title>HSR myWiki · 当期高难配队</title>
    <!--
      MIT License — Copyright (c) 2025 Gilded
      Based on the hsr-team-builder open-source project. See /LICENSE in the repository.
    -->
    <script>
      // 首屏同步写入主题，避免 Vue 挂载前的深浅色闪屏
      ;(function () {
        try {
          var key = 'hsr-team-builder:ui-theme:v1'
          var t = localStorage.getItem(key)
          if (t !== 'dark' && t !== 'light') {
            t =
              window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark'
          }
          document.documentElement.setAttribute('data-theme', t)
          document.documentElement.style.colorScheme = t
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark')
          document.documentElement.style.colorScheme = 'dark'
        }
      })()
    </script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html {
        background: #0f0f23;
        height: 100%;
        overflow-x: hidden;
        overscroll-behavior: none;
      }
      html[data-theme='light'] {
        background: #eef3f9;
      }
      body {
        background: linear-gradient(135deg, #0f0f23, #1a1a2e, #16213e);
        background-attachment: fixed;
        color: #ffffff;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        min-height: 100vh;
        overflow-x: hidden;
        overscroll-behavior: none;
        position: relative;
      }
      /* 浅色：深色文字，避免 index 内联白字压过后续样式 */
      html[data-theme='light'] body {
        background: #eef3f9;
        color: #0f172a;
      }
      #app {
        min-height: 100vh;
      }
      .bg-dark {
        background-color: rgba(15, 15, 35, 0.9) !important;
      }
      .border-primary {
        border-color: #00d4ff !important;
      }
      .text-primary {
        color: #00d4ff !important;
      }
      .btn-primary {
        background-color: #00d4ff !important;
        border-color: #00d4ff !important;
        color: #0f0f23 !important;
      }
      .btn-outline-primary {
        color: #00d4ff !important;
        border-color: #00d4ff !important;
      }
    </style>
    <link
      rel="preload"
      as="style"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      />
    </noscript>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
